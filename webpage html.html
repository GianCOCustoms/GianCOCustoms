<style id="site-css">:root{
  --ink:#1e2227; --ink-2:#2a2f35; --ink-3:#3a4047;
  --paper:#f3efe7; --surface:#fbf9f5; --line:#e2dbcd;
  --text:#25272a; --muted:#6c665b; --on-ink:#ece6da; --on-ink-muted:#b3ab9b;
  --brass:#a47552; --brass-d:#8a5f41; --brass-soft:#efe3d6;
  --ok:#3d7a57; --ok-soft:#e1efe6; --warn:#9a6a22; --warn-soft:#f6ead3; --bad:#9b3b30; --bad-soft:#f5e1de;
  --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1e22; --surface:#24282d; --line:#363b42; --text:#ece6da; --muted:#a39b8c;
    --brass-soft:#3a3027; --ok-soft:#1f3328; --warn-soft:#3a2f1c; --bad-soft:#3b2220;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1e22; --surface:#24282d; --line:#363b42; --text:#ece6da; --muted:#a39b8c;
  --brass-soft:#3a3027; --ok-soft:#1f3328; --warn-soft:#3a2f1c; --bad-soft:#3b2220;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; font-family:var(--sans); font-size:15px; line-height:1.6; color:var(--text); background:var(--paper); -webkit-font-smoothing:antialiased;}
img,svg{max-width:100%; display:block;}
a{color:inherit;}
button{font:inherit; color:inherit; cursor:pointer;}
input,select,textarea{font:inherit; color:var(--text);}
h1,h2,h3{font-family:var(--serif); font-weight:500; line-height:1.15; margin:0;}
p{margin:0;}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
@media (max-width:600px){ .wrap{padding:0 18px;} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--brass); color:#fff; border:0; padding:12px 22px; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; text-decoration:none; border-radius:2px; transition:background .15s;}
.btn:hover{background:var(--brass-d);}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--brass); color:var(--brass);}
.btn.light{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35);}
.btn.light:hover{border-color:#fff;}
.btn.small{padding:8px 14px; font-size:12px;}
.btn[disabled]{opacity:.55; cursor:not-allowed;}
.btn.danger{background:var(--bad);}
.linkish{background:none; border:0; padding:0; color:var(--brass); font-weight:600; font-size:13px; text-decoration:underline; text-underline-offset:3px;}

/* ===================== STOREFRONT ===================== */
.wrap{padding:0 28px;}
@media (max-width:600px){ .wrap{padding:0 16px;} }
.kicker{font-size:11.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--brass); font-weight:600; margin-bottom:12px;}
.btn svg{width:16px; height:16px;}
.btn.light svg{width:17px; height:17px;}

/* shared form fields (store + dashboard) */
.fld{display:flex; flex-direction:column; gap:6px; min-width:0;}
.fld label{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em;}
.fld input,.fld select,.fld textarea{width:100%; border:1px solid var(--line); background:var(--paper); padding:10px 12px; border-radius:2px; font-size:14px;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(164,117,82,.15);}
.search-input{position:relative;}
.search-input svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted);}
.search-input input{padding-left:34px;}
.empty{grid-column:1/-1; text-align:center; padding:50px 20px; border:1px dashed var(--line); color:var(--muted);}

/* legacy brand (dashboard sidebar) */
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--on-ink);}
.brand > svg{width:36px; height:36px;}
.brand-name{font-family:var(--serif); font-size:24px; line-height:1;}
.brand-sub{font-size:9.5px; letter-spacing:.42em; color:var(--on-ink-muted); margin-top:3px;}

/* new logo lockup */
.brand-lock{display:inline-grid; justify-items:center; line-height:1; color:#f3ede2; padding-top:2px;}
.brand-lock .mark{width:132px; height:30px; margin-bottom:-9px; color:#f3ede2;}
.brand-lock .brand-name{font-family:var(--serif); font-weight:500; font-size:31px; letter-spacing:.01em;}
.brand-lock .brand-sub{font-family:var(--sans); font-size:9.5px; font-weight:500; letter-spacing:.62em; margin:5px 0 0 .62em; color:#cfc6b6;}

.owner-strip{background:var(--brass); color:#fff; font-size:13px;}
.owner-strip .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:8px; padding-bottom:8px;}
.owner-strip button{background:#fff; color:var(--ink); border:0; padding:6px 12px; font-size:12px; font-weight:600; border-radius:2px;}

.site-head{background:#1f2328; color:var(--on-ink); position:sticky; top:0; z-index:30; box-shadow:0 1px 0 rgba(255,255,255,.04);}
.site-head .wrap{display:flex; align-items:center; justify-content:space-between; height:86px; gap:20px;}
.site-head .brand{flex-shrink:0;}
.site-nav{display:flex; gap:34px; font-size:14px;}
.site-nav a{text-decoration:none; color:#cdc6b8; padding:8px 0; position:relative;}
.site-nav a::after{content:''; position:absolute; left:0; right:0; bottom:0; height:1.5px; background:#f3ede2; transform:scaleX(0); transition:transform .25s;}
.site-nav a:hover{color:#fff;}
.site-nav a.on{color:#fff;}
.site-nav a.on::after{transform:scaleX(1);}
.head-actions{display:flex; align-items:center; gap:10px;}
.head-ic{width:40px; height:40px; border:0; border-radius:50%; background:transparent; color:#e8e1d4; display:inline-flex; align-items:center; justify-content:center;}
.head-ic:hover{background:rgba(255,255,255,.08);}
.head-ic svg{width:20px; height:20px;}
.owner-btn{background:transparent; border:1px solid var(--ink-3); color:var(--on-ink); padding:8px 14px; font-size:12.5px; border-radius:2px; display:flex; align-items:center; gap:8px;}
.owner-btn svg{width:16px; height:16px;}
.owner-btn:hover{border-color:var(--brass);}
@media (max-width:980px){ .site-nav{display:none;} }
@media (max-width:600px){ .site-head .wrap{height:72px;} .brand-lock .brand-name{font-size:26px;} .brand-lock .mark{width:112px; height:26px; margin-bottom:-8px;} .owner-btn span{display:none;} }

/* hero */
.hero{position:relative; color:#fff; background:#1b212c; min-height:clamp(520px, 74vh, 700px); display:flex; align-items:center; overflow:hidden; isolation:isolate;}
.hero-art{position:absolute; inset:0; z-index:-2;}
.hero-art svg,.hero-art img{width:100%; height:100%; object-fit:cover;}
.hero-shade{position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg, rgba(17,20,25,.86) 0%, rgba(17,20,25,.62) 32%, rgba(17,20,25,0) 58%), linear-gradient(0deg, rgba(17,20,25,.55), rgba(17,20,25,0) 30%);}
.hero-inner{position:relative; width:100%; padding-top:72px; padding-bottom:120px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px;}
.hero-copy{max-width:520px;}
.hero .kicker{color:#e8dccb; letter-spacing:.26em;}
.hero h1{font-size:clamp(46px, 6.4vw, 78px); line-height:1.02; color:#fff; margin-bottom:22px; letter-spacing:-.01em; text-wrap:balance;}
.hero-copy > p:not(.kicker){color:#ddd5c7; max-width:44ch; font-size:15.5px; line-height:1.7; margin-bottom:30px;}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
.hero-actions .btn{padding:14px 24px;}
.hero-tag{position:absolute; right:28px; top:34px; display:grid; gap:2px; text-align:left; border:1px solid rgba(255,255,255,.18); background:rgba(20,23,27,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#fff; padding:14px 18px; border-radius:4px; max-width:320px; transition:background .2s, transform .2s;}
.hero-tag:hover{background:rgba(20,23,27,.75); transform:translateY(-2px);}
.hero-tag .ht-k{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#d8b995;}
.hero-tag strong{font-family:var(--serif); font-weight:500; font-size:21px;}
.hero-tag span{font-size:12.5px; color:#d6cfc2;}
.hero-tag .ht-go{display:inline-flex; align-items:center; gap:6px; margin-top:6px; color:#fff; font-weight:600;}
.hero-tag .ht-go svg{width:14px; height:14px;}
/* lights-on moment */
.art .lw{opacity:.08; transition:opacity .9s ease; transition-delay:var(--d,0s);}
.art.lit .lw{opacity:1;}
@media (max-width:820px){
  .hero{min-height:0;}
  .hero-inner{flex-direction:column; align-items:flex-start; padding-top:56px; padding-bottom:110px;}
  .hero-shade{background:linear-gradient(180deg, rgba(17,20,25,.82) 0%, rgba(17,20,25,.55) 55%, rgba(17,20,25,.35) 100%);}
  .hero-tag{position:relative; right:auto; top:auto; align-self:stretch; max-width:none;}
}

/* finder */
.finder{position:relative; z-index:5; margin-top:-64px;}
.finder-box{background:var(--surface); border:1px solid var(--line); padding:20px 22px 16px; box-shadow:0 24px 50px -30px rgba(20,22,25,.55); border-radius:3px;}
.finder-row{display:grid; grid-template-columns:2.2fr repeat(5,1fr); gap:14px; align-items:end;}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
.chip{font:500 12.5px var(--sans); background:transparent; color:var(--text); padding:6px 13px; border-radius:999px; border:1px solid var(--line); transition:background .15s, border-color .15s, color .15s;}
.chip:hover{border-color:var(--brass); color:var(--brass);}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff;}
@media (max-width:980px){ .finder-row{grid-template-columns:1fr 1fr 1fr;} .finder-row .fld-q{grid-column:1/-1;} }
@media (max-width:560px){ .finder-row{grid-template-columns:1fr 1fr;} .finder-box{padding:16px;} .chips{flex-wrap:nowrap; overflow-x:auto; margin-left:-16px; margin-right:-16px; padding-left:16px; padding-right:16px; scrollbar-width:none;} .chip{flex-shrink:0;} }

/* sections */
.section{padding:78px 0;}
.designs{padding-top:64px;}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:28px; flex-wrap:wrap;}
.section-head h2{font-size:clamp(30px, 3.6vw, 42px);}
.sort-row{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
.count-note{font-size:13.5px; color:var(--muted);}
.fld-inline{flex-direction:row; align-items:center; gap:8px;}
.fld-inline label{white-space:nowrap;}
.fld-inline select{padding:8px 10px; background:var(--surface);}

/* cards */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(262px, 1fr)); gap:24px;}
.card{background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; transition:box-shadow .25s, transform .25s; border-radius:2px;}
.card:hover{box-shadow:0 24px 40px -28px rgba(20,22,25,.5); transform:translateY(-3px);}
.card-media{position:relative; aspect-ratio:16/11; overflow:hidden; background:#1b212c;}
.card-img{display:block; width:100%; height:100%; border:0; padding:0; background:none;}
.card-img svg,.card-img img{width:100%; height:100%; object-fit:cover; transition:transform .6s ease;}
.card:hover .card-img svg,.card:hover .card-img img{transform:scale(1.045);}
.card .art .lw{opacity:.55;}
.card:hover .art .lw{opacity:1;}
.tag{position:absolute; left:10px; bottom:10px; background:rgba(22,25,29,.85); color:#fff; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; padding:5px 9px; border-radius:2px; pointer-events:none;}
.card-3d{position:absolute; right:10px; top:10px; display:inline-flex; align-items:center; gap:6px; border:0; background:rgba(251,249,245,.94); color:var(--ink); font:600 12px var(--sans); padding:7px 11px 7px 9px; border-radius:999px; box-shadow:0 6px 16px -6px rgba(0,0,0,.45); transition:background .2s, color .2s, transform .2s;}
.card-3d svg{width:16px; height:16px;}
.card-3d:hover{background:var(--brass); color:#fff; transform:translateY(-1px);}
.card-body{padding:18px 18px 16px; display:flex; flex-direction:column; gap:4px; flex:1;}
.card-body h3{font-size:21px;}
.card-title{border:0; background:none; padding:0; font:inherit; color:inherit; text-align:left;}
.card-title:hover{color:var(--brass);}
.card-style{font-size:13px; color:var(--muted);}
.card-mid{display:grid; grid-template-columns:1fr 104px; gap:12px; align-items:center; margin:12px 0 14px;}
.specs{display:grid; gap:7px; font-size:12.5px; white-space:nowrap; color:var(--muted); padding:0; margin:0; list-style:none;}
.specs li{display:flex; align-items:center; gap:8px;}
.specs svg{width:16px; height:16px; color:var(--text); opacity:.7;}
.card-plan{border:0; background:#fff; padding:6px; border-radius:2px; box-shadow:inset 0 0 0 1px var(--line); transition:box-shadow .2s;}
.card-plan:hover{box-shadow:inset 0 0 0 1.5px var(--brass);}
.card-plan img{width:100%; height:80px; object-fit:contain;}
.card-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--line); padding-top:12px; margin-top:auto; flex-wrap:wrap;}
.price{font-family:var(--serif); font-size:23px;}
.card-actions{display:flex; align-items:center; gap:12px;}
.linkish-b{border:0; background:none; padding:0; font:600 11.5px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--brass); display:inline-flex; align-items:center; gap:5px;}
.linkish-b svg{width:13px; height:13px; transition:transform .2s;}
.linkish-b:hover svg{transform:translateX(3px);}

/* how it works (inspo: dark blueprint panel + light steps) */
.how{display:grid; grid-template-columns:minmax(0,4fr) minmax(0,8fr); background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.how-left{background-color:#1f2328; background-image:linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px); background-size:80px 80px, 80px 80px, 16px 16px, 16px 16px; color:#f3ede2; display:flex; align-items:center; justify-content:flex-end; position:relative; overflow:hidden;}
.how-left::after{content:''; position:absolute; right:-40px; bottom:-30px; width:260px; height:14px; background:linear-gradient(90deg,#c9a36b,#e8c98f 80%,#2a2a2a 80%); transform:rotate(-32deg); opacity:.6; border-radius:2px;}
.how-left-in{max-width:420px; padding:72px 44px 72px 28px;}
.how h2{font-size:clamp(32px, 3.6vw, 44px); margin-bottom:16px;}
.how-left p:not(.kicker){color:#cfc7b8; margin-bottom:26px; max-width:38ch;}
.how-right{display:flex; align-items:center; padding:56px 28px;}
.how-steps{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(5,1fr); width:100%; max-width:820px;}
.how-steps li{text-align:center; padding:0 14px; position:relative; border-left:1px solid var(--line);}
.how-steps li:first-child{border-left:0;}
.how-steps li:not(:last-child)::after{content:''; position:absolute; right:-5px; top:31px; width:9px; height:9px; border-top:1.5px solid var(--muted); border-right:1.5px solid var(--muted); transform:rotate(45deg); background:var(--surface);}
.how-ic{width:64px; height:64px; margin:0 auto; border-radius:50%; background:#fff; box-shadow:inset 0 0 0 1px var(--line), 0 8px 18px -12px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; color:var(--ink);}
.how-ic svg{width:36px; height:36px;}
.how-n{display:flex; width:24px; height:24px; margin:14px auto 12px; border-radius:50%; background:var(--brass); color:#fff; font:600 12px var(--sans); align-items:center; justify-content:center;}
.how-steps h3{font-family:var(--sans); font-size:14px; font-weight:600; margin-bottom:6px;}
.how-steps p{font-size:12.5px; color:var(--muted); line-height:1.55;}
@media (max-width:1000px){ .how{grid-template-columns:1fr;} .how-left{justify-content:flex-start;} .how-left-in{padding:56px 28px;} }
@media (max-width:700px){ .how-steps{grid-template-columns:1fr; gap:22px;} .how-steps li{display:grid; grid-template-columns:52px 1fr; column-gap:14px; text-align:left; border-left:0; padding:0;} .how-steps li::after{display:none;} .how-ic{width:52px; height:52px; grid-row:1/4;} .how-ic svg{width:28px; height:28px;} .how-n{margin:0 0 6px; width:22px; height:22px;} .how-right{padding:40px 16px;} .how-left-in{padding:48px 16px;} }

/* why (dark timber band) */
.why{color:#efe8dc; background-color:#2a211b; background-image:linear-gradient(90deg, rgba(20,16,13,.92) 0%, rgba(20,16,13,.72) 45%, rgba(20,16,13,.55) 100%), repeating-linear-gradient(90deg, #4a3526 0 3px, #5a412e 3px 58px, #3b2a1f 58px 61px, #624733 61px 122px, #3e2c20 122px 125px, #553d2b 125px 176px); padding:84px 0;}
.why-grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:48px; align-items:center;}
.why h2{font-size:clamp(32px, 3.6vw, 44px); color:#fff; margin-bottom:16px;}
.why-copy p:not(.kicker){color:#d7cdbd; margin-bottom:26px; max-width:46ch;}
.why .kicker{color:#d8b995;}
.why-cols{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,1fr);}
.why-cols li{text-align:center; padding:6px 18px; border-left:1px solid rgba(255,255,255,.16);}
.why-cols li:first-child{border-left:0;}
.why-cols svg{width:44px; height:44px; margin:0 auto 14px; color:#f3ede2;}
.why-cols h3{font-size:19px; color:#fff; margin-bottom:8px;}
.why-cols p{font-size:13px; color:#cbbfae; line-height:1.55;}
@media (max-width:980px){ .why-grid{grid-template-columns:1fr;} }
@media (max-width:640px){ .why-cols{grid-template-columns:1fr 1fr; row-gap:26px;} .why-cols li:nth-child(3){border-left:0;} }

/* custom concept band */
.custom{position:relative; color:#fff; overflow:hidden; isolation:isolate; padding:76px 0;}
.custom-art{position:absolute; inset:0; z-index:-1;}
.custom-art svg{width:100%; height:100%;}
.custom::before{content:''; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg, rgba(17,20,25,.82), rgba(17,20,25,.35) 60%, rgba(17,20,25,0));}
.custom-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; align-items:center;}
.custom h2{font-size:clamp(30px, 3.4vw, 40px); margin-bottom:14px;}
.custom .kicker{color:#e3d2bb;}
.custom-copy p:not(.kicker){color:#ddd4c6; max-width:44ch; margin-bottom:24px;}
.custom-list{list-style:none; margin:0; padding:22px 26px; display:grid; gap:12px; background:rgba(20,23,27,.62); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12); border-radius:4px; max-width:360px; justify-self:start;}
.custom-list li{display:flex; align-items:center; gap:12px; font-size:14px;}
.custom-list svg{width:18px; height:18px; color:#d8b995; flex-shrink:0;}
@media (max-width:820px){ .custom-grid{grid-template-columns:1fr;} .custom::before{background:rgba(17,20,25,.66);} }

/* contact */
.contact-grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:56px;}
.contact h2{font-size:clamp(30px, 3.4vw, 40px);}
.contact-grid > div > p{color:var(--muted); margin:14px 0 22px; max-width:42ch;}
.mail-link{display:inline-flex; align-items:center; gap:10px; font-family:var(--serif); font-size:20px; text-decoration:none; border-bottom:1px solid var(--brass); padding-bottom:4px; word-break:break-all;}
.mail-link svg{width:20px; height:20px; color:var(--brass); flex-shrink:0;}
.contact-form{background:var(--surface); border:1px solid var(--line); padding:26px; display:grid; gap:14px;}
.contact-form .row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.contact-form textarea{min-height:120px; resize:vertical;}
.form-note{font-size:12.5px; color:var(--muted);}
@media (max-width:820px){ .contact-grid{grid-template-columns:1fr; gap:30px;} .contact-form .row{grid-template-columns:1fr;} .contact-form{padding:18px;} }

/* footer */
.site-foot{background:#1a1d21; color:#8e877a; font-size:13px; padding:34px 0 28px;}
.foot-row{display:flex; align-items:center; flex-wrap:wrap; gap:18px 28px; padding-bottom:22px; border-bottom:1px solid #2c3137; margin-bottom:18px;}
.foot-brand .brand-lock .brand-name{font-size:24px;}
.foot-brand .brand-lock .mark{width:100px; height:24px; margin-bottom:-7px;}
.foot-tag{font-family:var(--serif); color:#e6dfd2; font-size:15px; padding-left:28px; border-left:1px solid #3a4047;}
.foot-links{display:flex; gap:24px; flex-wrap:wrap; margin-left:auto;}
.foot-links a{text-decoration:none; color:#cfc7b8;}
.foot-links a:hover{color:#fff;}
.site-foot small{display:block; max-width:110ch; line-height:1.6; font-size:11.5px;}
@media (max-width:820px){ .foot-links{margin-left:0;} .foot-tag{border-left:0; padding-left:0;} }

/* modal + detail */
.modal-bg{position:fixed; inset:0; background:rgba(15,17,20,.7); z-index:95; display:flex; align-items:flex-start; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px; overflow-y:auto; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{background:var(--surface); width:100%; max-width:980px; position:relative; animation:pop .25s ease; border-radius:4px; overflow:hidden;}
.modal-xl{max-width:1240px;}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.99);} to{opacity:1; transform:none;}}
.modal-x{position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%; border:0; background:var(--ink); color:#fff; font-size:22px; line-height:1; z-index:5;}
.modal-x:hover{background:var(--brass);}
.detail{display:grid; grid-template-columns:minmax(0,8fr) minmax(0,4fr);}
.d-media{background:#191c20; display:flex; flex-direction:column; min-width:0;}
.d-tabs{display:flex; gap:4px; padding:10px; background:#15181b;}
.d-tabs button{white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; gap:7px; border:0; background:transparent; color:#b9b1a3; font:600 13px var(--sans); padding:9px 14px; border-radius:999px; transition:background .2s,color .2s;}
.d-tabs button svg{width:16px; height:16px;}
.d-tabs button:hover{color:#fff;}
.d-tabs button[aria-selected="true"]{background:#fbf9f5; color:#1e2227;}
.d-stage{position:relative; flex:1; min-height:min(70vh, 640px); background:#1b212c;}
.d-ext,.d-3d{position:absolute; inset:0;}
.d-ext svg,.d-ext img{width:100%; height:100%; object-fit:cover;}
.d-stage.is-plan{background:#f6f2ea; overflow:auto;}
.d-plan{min-height:100%; display:flex; flex-direction:column; padding:14px 18px 14px;}
.d-plan-top{display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:36px;}
.d-plan-top .seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff;}
.d-plan-top .seg button{border:0; background:transparent; padding:7px 14px; font:600 12.5px var(--sans); color:var(--muted);}
.d-plan-top .seg button[aria-pressed="true"]{background:var(--ink); color:#fff;}
.d-plan-svg{flex:1; display:flex; align-items:center; justify-content:center; padding:8px 0;}
.d-plan-svg svg{max-height:calc(min(70vh, 640px) - 120px); width:100%;}
.d-plan-svg .pl-room{cursor:pointer;}
.d-plan-svg .pl-room.hot{fill:#e3cbb0 !important;}
.d-plan-read{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; font-size:13px; color:#2a2622; min-height:22px;}
.d-plan-read strong{font-family:var(--serif); font-weight:500; font-size:17px;}
.d-plan-read span{color:var(--muted);}
.d-plan-read em{font-style:normal; color:var(--brass); font-weight:600;}
.d-plan-note{font-size:11.5px; color:var(--muted); margin-top:4px;}
.d-planimg{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px; background:#fff;}
.d-planimg img{max-width:100%; max-height:calc(100% - 40px); object-fit:contain;}
.d-note-box{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#e9e2d6; text-align:center; padding:24px;}
.d-info{padding:30px 28px; display:flex; flex-direction:column; gap:16px; min-width:0;}
.d-info .kicker{margin-bottom:6px;}
.d-info h2{font-size:34px; padding-right:40px;}
.spec-table{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); margin:0;}
.spec-table div{padding:10px 0; border-bottom:1px solid var(--line);}
.spec-table dt{font-size:11.5px; color:var(--muted);}
.spec-table dd{margin:0; font-weight:600;}
.d-desc{color:var(--text); line-height:1.65;}
.d-3dcta{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:1px solid var(--line); background:linear-gradient(135deg, #fbf9f5, #f1e7da); padding:12px 14px; border-radius:4px; transition:border-color .2s, transform .2s;}
.d-3dcta:hover{border-color:var(--brass); transform:translateY(-1px);}
.d-3dcta > svg:first-child{width:30px; height:30px; color:var(--brass); flex-shrink:0;}
.d-3dcta > svg:last-child{width:16px; height:16px; margin-left:auto; color:var(--brass);}
.d-3dcta span{display:grid;}
.d-3dcta strong{font-size:14px;}
.d-3dcta small{font-size:12px; color:var(--muted);}
.d-buy{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
.d-buy .price{font-size:32px;}
.secure{font-size:12.5px; color:var(--muted); display:flex; gap:8px; align-items:flex-start;}
.secure svg{width:16px; height:16px; flex-shrink:0; margin-top:2px; color:var(--ok);}
.secure.fine{font-size:11.5px;}
@media (max-width:900px){
  .modal-bg{padding:0;}
  .modal{border-radius:0; min-height:100%;}
  .detail{grid-template-columns:1fr;}
  .d-tabs{padding-right:60px; overflow-x:auto;}
  .d-stage{flex:none; height:62vh; min-height:320px;}
  .d-info{padding:22px 16px 40px;}
  .modal-x{top:calc(env(safe-area-inset-top,0px) + 8px); right:8px;}
}
@media (max-width:520px){ .d-tabs{gap:2px; padding:8px 56px 8px 8px;} .d-tabs button{padding:8px 10px; font-size:12px;} .d-tabs button svg{display:none;} }

.toast-zone{position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); left:50%; transform:translateX(-50%); z-index:220; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{background:var(--ink); color:#fff; padding:11px 18px; font-size:13.5px; border-radius:3px; box-shadow:0 10px 30px -10px rgba(0,0,0,.5); max-width:92vw;}
.toast.warn{background:var(--warn);}
.toast.bad{background:var(--bad);}

.plan-svg{width:100%;height:auto;display:block;overflow:visible}
.plan-svg .pl-room{transition:fill .15s}
.pl-wall{stroke:#2a2724;stroke-linecap:square}
.pl-win{stroke:#fbf9f5}
.pl-glass{stroke:#6f8591;stroke-width:.14}
.pl-swing{fill:none;stroke:#8f8575;stroke-width:.13}
.pl-gdoor{stroke:#8f8575;stroke-width:.22;stroke-dasharray:.9 .5}
.pl-tread{stroke:#9b8f7b;stroke-width:.12}
.pl-arrow{fill:none;stroke:#5d554a;stroke-width:.16;stroke-linecap:round;stroke-linejoin:round}
.pl-porch{fill:rgba(164,117,82,.06);stroke:#a38d6f;stroke-width:.15;stroke-dasharray:.7 .45}
.pl-label{font-family:Inter,system-ui,sans-serif;fill:#2b2926;font-weight:600;letter-spacing:.01em}
.pl-dim{font-family:Inter,system-ui,sans-serif;fill:#7a7266}
.pl-sub{font-family:Inter,system-ui,sans-serif;fill:#8a8172;font-size:1.1px}
.pl-scale line{stroke:#6d6457;stroke-width:.16}.pl-scale text{fill:#6d6457;font-family:Inter,system-ui,sans-serif}
.plan-svg.mini .pl-room{fill:#fff}
.plan-svg.mini .pl-wall{stroke:#3a3632}

/* ===== 3D walkthrough viewer ===== */
.t3d{position:relative; width:100%; height:100%; min-height:320px; overflow:hidden; background:linear-gradient(180deg,#9db3c4 0%,#c9d3d6 42%,#d9dbd6 60%,#dadad4 100%); color:#fff; font-family:var(--sans); user-select:none; -webkit-user-select:none; touch-action:none; transition:background .8s;}
.t3d.is-dusk{background:linear-gradient(180deg,#1d2231 0%,#3d3c52 38%,#7e6260 58%,#85695f 100%);}
.t3d-canvas{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; outline:none;}
.t3d-canvas:active{cursor:grabbing;}
.t3d.is-walk .t3d-canvas{cursor:crosshair;}
.t3d-labels{position:absolute; inset:0; pointer-events:none;}
.t3d-label{position:absolute; left:0; top:0; opacity:0; transition:opacity .25s; font-size:11.5px; font-weight:600; letter-spacing:.02em; color:#2a2622; background:rgba(251,249,245,.9); padding:3px 8px; border-radius:20px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.15);}
.t3d-label.hot{background:var(--brass,#a47552); color:#fff;}
.t3d.is-walk .t3d-label{font-size:11px; background:rgba(30,34,39,.62); color:#fff; box-shadow:none;}
.t3d-bar{position:absolute; left:12px; top:12px; right:130px; display:flex; gap:8px; flex-wrap:wrap; z-index:3;}
.t3d-seg{display:inline-flex; background:rgba(24,27,31,.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:999px; padding:3px; box-shadow:0 6px 20px -8px rgba(0,0,0,.5);}
.t3d-seg button{display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; color:#d9d2c4; font:600 12.5px var(--sans); padding:7px 12px; border-radius:999px; cursor:pointer; transition:background .2s,color .2s;}
.t3d-seg button svg{width:16px; height:16px;}
.t3d-seg button:hover{color:#fff;}
.t3d-seg button[aria-pressed="true"]{background:#fbf9f5; color:#1e2227;}
.t3d-tools{position:absolute; right:12px; top:12px; display:flex; gap:6px; z-index:3;}
.t3d-ic{width:38px; height:38px; border-radius:50%; border:0; background:rgba(24,27,31,.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 20px -8px rgba(0,0,0,.5); transition:background .2s;}
.t3d-ic:hover{background:var(--brass,#a47552);}
.t3d-ic svg{width:17px; height:17px;}
.t3d.is-tour .t3d-ic[data-a="tour"]{background:var(--brass,#a47552);}
.t3d-room{position:absolute; left:14px; bottom:14px; z-index:3; display:flex; flex-direction:column; gap:1px; pointer-events:none; text-shadow:0 1px 10px rgba(0,0,0,.5);}
.t3d-room strong{font-family:var(--serif); font-weight:500; font-size:26px; line-height:1.1;}
.t3d-room span{font-size:13px; opacity:.9;}
.t3d-room em{font-style:normal; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; order:-1;}
.t3d-map{position:absolute; right:12px; bottom:12px; width:220px; height:160px; background:rgba(24,27,31,.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:12px; display:none; cursor:pointer; z-index:3;}
.t3d.is-walk .t3d-map{display:block;}
.t3d-stairs{position:absolute; left:50%; bottom:22px; transform:translateX(-50%); z-index:4; display:inline-flex; align-items:center; gap:8px; border:0; background:var(--brass,#a47552); color:#fff; font:600 14px var(--sans); padding:11px 18px; border-radius:999px; cursor:pointer; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); animation:t3dpulse 2s ease-in-out infinite;}
.t3d-stairs svg{width:18px; height:18px;}
.t3d-stairs.down svg{transform:scaleY(-1);}
.t3d-stairs[hidden]{display:none;}
@keyframes t3dpulse{0%,100%{box-shadow:0 0 0 0 rgba(164,117,82,.55),0 10px 30px -10px rgba(0,0,0,.6);}50%{box-shadow:0 0 0 10px rgba(164,117,82,0),0 10px 30px -10px rgba(0,0,0,.6);}}
.t3d-joy{position:absolute; left:18px; bottom:70px; width:96px; height:96px; border-radius:50%; background:rgba(24,27,31,.35); border:1.5px solid rgba(255,255,255,.4); display:none; z-index:4; touch-action:none;}
.t3d-knob{position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; background:rgba(251,249,245,.9); box-shadow:0 4px 12px rgba(0,0,0,.3);}
@media (pointer:coarse){ .t3d.is-walk .t3d-joy{display:block;} }
.t3d-hint{position:absolute; left:50%; top:62px; transform:translateX(-50%); margin:0; font-size:12.5px; background:rgba(24,27,31,.72); padding:7px 14px; border-radius:999px; white-space:nowrap; pointer-events:none; transition:opacity .6s; z-index:2;}
.t3d.hint-gone .t3d-hint{opacity:0;}
.t3d-note{position:absolute; right:14px; bottom:12px; margin:0; font-size:11px; color:rgba(30,34,39,.75); pointer-events:none; z-index:2;}
.t3d.is-dusk .t3d-note{color:rgba(255,255,255,.7);}
.t3d.is-walk .t3d-note{bottom:180px; color:rgba(255,255,255,.85); text-shadow:0 1px 6px rgba(0,0,0,.6);}
.t3d-ping{position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border:2px solid #fff; border-radius:50%; pointer-events:none; animation:t3dping .7s ease-out forwards; z-index:3;}
@keyframes t3dping{from{transform:scale(.4); opacity:1;} to{transform:scale(1.6); opacity:0;}}
.t3d.is-jump::after{content:''; position:absolute; inset:0; background:#fbf9f5; animation:t3dflash .26s ease-out forwards; pointer-events:none;}
@keyframes t3dflash{from{opacity:.55;} to{opacity:0;}}
.t3d.is-full{position:fixed; inset:0; z-index:200; min-height:0; height:100vh; height:100dvh; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
body.t3d-lock{overflow:hidden;}
.t3d-fallback{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:24px; color:#2a2622; background:#efe9de;}
@media (max-width:640px){
  .t3d-seg button span{display:none;}
  .t3d-seg button{padding:8px 10px;}
  .t3d-bar{right:128px;}
  .t3d-map{width:150px; height:110px;}
  .t3d-room strong{font-size:20px;}
  .t3d.is-walk .t3d-note{bottom:130px;}
  .t3d-hint{top:auto; bottom:58px; white-space:normal; width:max-content; max-width:88%; text-align:center;}
  .t3d.is-walk .t3d-room{bottom:auto; top:62px;}
}
@media (prefers-reduced-motion: reduce){ .t3d-stairs{animation:none;} }

/* ===================== FLOOR PLAN BUILDER ===================== */
.walk-box{display:flex; gap:14px; align-items:center; border:1px solid var(--line); background:var(--paper); border-radius:4px; padding:12px 14px;}
.walk-mini{width:110px; flex-shrink:0; background:#fff; padding:6px; border-radius:2px; box-shadow:inset 0 0 0 1px var(--line);}
.walk-txt{display:grid; gap:4px; font-size:13px;}
.walk-txt span{color:var(--muted);}
.walk-btns{display:flex; gap:14px; align-items:center; margin-top:6px; flex-wrap:wrap;}

.bld{position:fixed; inset:0; z-index:96; background:#f3efe7; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); animation:fadeIn .15s ease;}
.bld-top{display:flex; align-items:center; gap:14px; padding:10px 16px; background:#1f2328; color:#ece6da; flex-wrap:wrap;}
.bld-title{display:grid; line-height:1.2; margin-right:6px;}
.bld-title strong{font-family:var(--serif); font-weight:500; font-size:19px;}
.bld-title span{font-size:12px; color:#b3ab9b;}
.bld-levels .seg{border-color:#3a4047;}
.bld-levels .seg button{background:transparent; color:#cfc7b8; padding:7px 12px;}
.bld-levels .seg button[aria-pressed="true"]{background:#fbf9f5; color:#1e2227;}
.bld-tools{display:flex; gap:4px; background:#2a2f35; padding:3px; border-radius:6px;}
.bld-tools button{display:inline-flex; align-items:center; gap:7px; border:0; background:transparent; color:#cfc7b8; padding:8px 12px; border-radius:4px; font:600 12.5px var(--sans);}
.bld-tools button svg{width:17px; height:17px;}
.bld-tools button:hover{color:#fff;}
.bld-tools button[aria-pressed="true"]{background:var(--brass); color:#fff;}
.bld-acts{display:flex; align-items:center; gap:4px; margin-left:auto;}
.bld-acts button{width:34px; height:34px; border:0; border-radius:4px; background:transparent; color:#e6dfd2; display:inline-flex; align-items:center; justify-content:center;}
.bld-acts button:hover{background:#2f353c;}
.bld-acts svg{width:18px; height:18px;}
.bld-sep{width:1px; height:22px; background:#3a4047; margin:0 4px;}
.bld-main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 320px; min-height:0;}
.bld-canvas{position:relative; min-height:0; overflow:hidden; background:#faf7f1; touch-action:none;}
#bld-svg{position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none;}
.bld-canvas[data-tool="draw"] #bld-svg{cursor:crosshair;}
.bld-canvas[data-tool="trace"] #bld-svg{cursor:move;}
.bld-tip{position:absolute; left:14px; bottom:14px; right:14px; margin:0; font-size:12.5px; color:#fff; background:rgba(31,35,40,.82); padding:8px 12px; border-radius:6px; pointer-events:none; max-width:560px;}
.bld-plan .pl-room{fill-opacity:.62;}
.bld-hit{fill:transparent; stroke:transparent;}
.bld-hit.on{stroke:#a47552; stroke-dasharray:.5 .35; fill:rgba(164,117,82,.08);}
.bld-handle{fill:#fff; stroke:#a47552; stroke-width:.12;}
.bld-dim{fill:#8a5f41; font-family:var(--sans); font-weight:700; paint-order:stroke; stroke:#faf7f1; stroke-width:.25;}
.bld-new{fill:rgba(164,117,82,.18); stroke:#a47552; stroke-dasharray:.4 .3;}
.bld-ghost{fill:none; stroke:#7f7566; stroke-width:.12; stroke-dasharray:.3 .3; opacity:.8;}
.bld-op{stroke-linecap:round; opacity:.9;}
.bld-op.k-door,.lg.k-door{stroke:#a47552; background:#a47552;}
.bld-op.k-open,.lg.k-open{stroke:#5f8a6a; background:#5f8a6a;}
.bld-op.k-window,.lg.k-window{stroke:#4f8fb5; background:#4f8fb5;}
.bld-op.k-slider,.lg.k-slider{stroke:#2c6f96; background:#2c6f96;}
.bld-op.k-frontdoor,.lg.k-frontdoor{stroke:#6b3f8f; background:#6b3f8f;}
.bld-op.k-garagedoor{stroke:#555;}
.bld-op.on{opacity:1; stroke-dasharray:.35 .2;}
.bld-hover{stroke:#a47552; stroke-linecap:round; opacity:.45;}
.bld-cal{fill:#d9432f; stroke:#fff; stroke-width:.1;}
.bld-calline{stroke:#d9432f; stroke-dasharray:.4 .25;}
.bld-side{background:var(--surface); border-left:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column;}
.bs{padding:14px 16px; border-bottom:1px solid var(--line); display:grid; gap:8px;}
.bs h3{font-family:var(--sans); font-size:15px; font-weight:600;}
.bs-hint{font-size:12.5px; color:var(--muted); line-height:1.5;}
.bs-l{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em; margin-top:4px;}
.bs input[type=text],.bs input:not([type]),.bs input[type=number],.bs select{width:100%; border:1px solid var(--line); background:var(--paper); padding:8px 10px; border-radius:2px; font-size:14px;}
.bs input[type=range]{width:100%; accent-color:var(--brass);}
.bs-card{background:#fbf6ee;}
.bs-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.bs-small{font-size:12px; color:var(--muted); line-height:1.5;}
.bs-rects{display:grid; gap:4px; font-size:13px;}
.bs-rect{display:flex; justify-content:space-between;}
.bs-del{justify-self:start; color:var(--bad); border-color:#e7c9c3;}
.bs-list{list-style:none; margin:0; padding:0; display:grid; gap:2px; max-height:260px; overflow-y:auto;}
.bs-list button{width:100%; display:flex; justify-content:space-between; gap:8px; border:0; background:transparent; padding:7px 8px; border-radius:3px; font-size:13.5px; text-align:left;}
.bs-list button:hover{background:var(--paper);}
.bs-list button[aria-pressed="true"]{background:var(--brass-soft); color:var(--brass-d); font-weight:600;}
.bs-list small{color:var(--muted); font-weight:400;}
.bs-kinds{display:flex; flex-wrap:wrap; gap:6px;}
.bs-kinds button{border:1px solid var(--line); background:#fff; padding:6px 10px; border-radius:999px; font:500 12.5px var(--sans);}
.bs-kinds button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
.bs-step{display:flex; gap:6px; align-items:center;}
.bs-step button{width:34px; height:34px; border:1px solid var(--line); background:#fff; border-radius:3px; font-size:16px; flex-shrink:0;}
.bs-step input{flex:1;}
.bs-nudge button{width:auto; padding:0 12px; font-size:12.5px;}
.bs-legend{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:12px; color:var(--muted);}
.lg{display:inline-block; width:14px; height:4px; border-radius:2px;}
.bs-thumb{background:#fff; border:1px solid var(--line); padding:6px; border-radius:2px;}
.bs-thumb img{max-height:120px; margin:0 auto; object-fit:contain;}
.bs-file{position:relative; overflow:hidden; justify-self:start;}
.bs-file input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.bs-warn{background:#fbf1e1;}
.bs-warn strong{color:var(--warn);}
.bs-stats{grid-template-columns:repeat(3,1fr); text-align:center; gap:4px;}
.bs-stats strong{display:block; font-family:var(--serif); font-weight:500; font-size:22px;}
.bs-stats span{font-size:11.5px; color:var(--muted);}
.bs-foot{margin-top:auto; padding:12px 16px; display:grid; grid-template-columns:1fr; gap:8px; border-top:1px solid var(--line); background:var(--surface); position:sticky; bottom:0;}
.bs-foot > div{display:grid; grid-template-columns:1fr 1.4fr; gap:8px;}
.bs-foot .btn{white-space:nowrap;}
.bld-prev{position:absolute; inset:0; z-index:4; background:#1b212c;}
.bld-prev[hidden]{display:none;}
.bld-prev-host{position:absolute; inset:0;}
.bld-prev-x{position:absolute; left:50%; transform:translateX(-50%); bottom:16px; z-index:10; border:0; background:#fbf9f5; color:#1e2227; font:600 13px var(--sans); padding:10px 18px; border-radius:999px; box-shadow:0 8px 20px -8px rgba(0,0,0,.5);}
@media (max-width:900px){
  .bld-main{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,42vh);}
  .bld-side{border-left:0; border-top:1px solid var(--line);}
  .bld-tools button span{display:none;}
  .bld-title span{display:none;}
  .bld-acts{margin-left:0;}
  .bld-tip{display:none;}
}

/* ===== mobile menu ===== */
.menu-btn{display:none;}
.m-nav{position:absolute; left:0; right:0; top:100%; background:#1f2328; border-top:1px solid #2c3137; box-shadow:0 20px 30px -20px rgba(0,0,0,.6); display:flex; flex-direction:column; padding:8px 0 14px;}
.m-nav[hidden]{display:none;}
.m-nav a{color:#e8e1d4; text-decoration:none; padding:13px 22px; font-size:16px;}
.m-nav a:hover,.m-nav a:focus-visible{background:#2a2f35; color:#fff;}
@media (max-width:980px){ .menu-btn{display:inline-flex;} }
@media (min-width:981px){ .m-nav{display:none !important;} }
.site-head .wrap{position:relative;}
.site-head{position:sticky;}

/* ===== services ===== */
.services{padding-top:12px;}
.svc-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:18px;}
.svc{background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--brass); padding:20px 20px 16px; display:flex; flex-direction:column; gap:8px; border-radius:2px; transition:box-shadow .25s, transform .25s;}
.svc:hover{box-shadow:0 20px 36px -28px rgba(20,22,25,.5); transform:translateY(-2px);}
.svc h3{font-size:20px;}
.svc p{font-size:13.5px; color:var(--muted); line-height:1.55; flex:1;}
.svc-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--line); padding-top:12px; margin-top:6px;}
.svc-foot .price{font-size:20px;}

/* ===== footer legal ===== */
.foot-legal{display:flex; gap:20px; flex-wrap:wrap; margin-bottom:12px;}
.foot-legal button{background:none; border:0; padding:0; color:#cfc7b8; font-size:12.5px; text-decoration:underline; text-underline-offset:3px;}
.foot-legal button:hover{color:#fff;}

/* ===== detail: includes, mobile buy bar ===== */
.d-incl{border:1px solid var(--line); border-radius:4px; padding:14px 16px;}
.d-incl h3{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
.d-incl ul{list-style:none; margin:0; padding:0; display:grid; gap:6px;}
.d-incl li{display:flex; gap:9px; font-size:13.5px; line-height:1.45;}
.d-incl li svg{width:16px; height:16px; color:var(--ok); flex-shrink:0; margin-top:2px;}
.secure.fine .linkish{font-size:11.5px; font-weight:600;}
.m-buybar{display:none;}
@media (max-width:900px){
  .modal-xl .d-info{padding-bottom:96px;}
  .m-buybar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:6; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -10px 24px -18px rgba(0,0,0,.45);}
  .m-buybar > div{display:grid; min-width:0;}
  .m-buybar .price{font-size:24px; line-height:1.1;}
  .m-buybar small{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .m-buybar .btn{flex-shrink:0;}
  .t3d.is-full ~ .m-buybar, body.t3d-lock .m-buybar{display:none;}
}

/* ===== policy / thank-you modal ===== */
.modal.policy{max-width:680px;}
.policy-in{padding:38px 40px 34px; display:grid; gap:14px;}
.policy-in h2{font-size:32px; padding-right:40px;}
.policy-in p{line-height:1.7;}
.policy-in .kicker{margin-bottom:0;}
.policy-links{display:flex; gap:18px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:14px;}
.thanks-ic{width:52px; height:52px; border-radius:50%; background:var(--ok-soft); color:var(--ok); display:inline-flex; align-items:center; justify-content:center;}
.thanks-ic svg{width:26px; height:26px;}
@media (max-width:600px){ .policy-in{padding:62px 18px 40px;} .policy-in h2{font-size:27px;} }

/* ===== contact sent ===== */
.sent{display:flex; gap:14px; align-items:flex-start; padding:10px 0;}
.sent > svg{width:30px; height:30px; color:var(--ok); flex-shrink:0; margin-top:2px;}
.sent h3{font-size:22px; margin-bottom:6px;}
.sent p{color:var(--muted); margin-bottom:10px;}

/* ===== dashboard ===== */
.callout.emb{display:grid; gap:4px; border-left-color:var(--warn); background:var(--warn-soft);}
.panel-head > div > p{margin-top:2px;}

/* ===== announcement bar ===== */
.announce{background:var(--brass); color:#fff; font-size:13.5px; text-align:center;}
.announce .wrap{padding-top:8px; padding-bottom:8px;}
.announce.is-empty{display:none;}
body.editing .announce.is-empty{display:block; opacity:.55;}

/* ===== custom sections ===== */
.finder-gap{height:24px;}
.csec-grid{display:grid; grid-template-columns:1fr; gap:40px; align-items:center;}
.csec.has-img .csec-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.csec.flip .csec-img{order:-1;}
.csec-copy{display:grid; gap:14px; justify-items:start; max-width:620px;}
.csec-copy .kicker{margin-bottom:0;}
.csec h2{font-size:clamp(30px, 3.4vw, 42px);}
.csec-text{color:var(--muted); line-height:1.75; font-size:15.5px;}
.csec-img img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:3px; box-shadow:0 30px 50px -36px rgba(0,0,0,.6);}
.csec.dark{background:var(--ink); color:#efe8dc;}
.csec.dark h2{color:#fff;} .csec.dark .csec-text{color:#cfc7b8;}
@media (max-width:820px){ .csec.has-img .csec-grid{grid-template-columns:1fr;} .csec.flip .csec-img{order:0;} }
[data-edit].ml{white-space:pre-line;}

/* ===== listing prev / next ===== */
.d-media{position:relative;}
.d-arrow{position:absolute; top:calc(50% + 24px); transform:translateY(-50%); z-index:4; width:46px; height:46px; border-radius:50%; border:0; background:rgba(251,249,245,.92); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px -8px rgba(0,0,0,.55); transition:background .2s, color .2s, transform .2s;}
.d-arrow svg{width:22px; height:22px;}
.d-arrow:hover{background:var(--brass); color:#fff;}
.d-arrow.prev{left:14px;} .d-arrow.next{right:14px;}
.d-arrow.prev:hover{transform:translateY(-50%) translateX(-2px);} .d-arrow.next:hover{transform:translateY(-50%) translateX(2px);}
.d-media.on-3d .d-arrow{display:none;}
.d-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding-bottom:12px; margin-top:-6px; padding-right:40px;}
.d-nav button{display:inline-flex; align-items:center; gap:4px; border:0; background:none; padding:4px 2px; color:var(--muted); font:600 12.5px var(--sans); max-width:42%; min-width:0;}
.d-nav button span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.d-nav button svg{width:16px; height:16px; flex-shrink:0;}
.d-nav button:hover{color:var(--brass);}
.d-count{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); white-space:nowrap;}
.modal-bg.nav-swap{animation:none;}
.modal.from-r{animation:fromR .28s ease;} .modal.from-l{animation:fromL .28s ease;}
@keyframes fromR{from{opacity:.4; transform:translateX(28px);} to{opacity:1; transform:none;}}
@keyframes fromL{from{opacity:.4; transform:translateX(-28px);} to{opacity:1; transform:none;}}
@media (max-width:900px){ .d-arrow{width:40px; height:40px; top:50%;} .d-arrow.prev{left:8px;} .d-arrow.next{right:8px;} .d-nav{padding-right:0; margin-top:0;} }

/* ===== website editor ===== */
.side-edit{display:flex; align-items:center; gap:8px; background:var(--brass) !important; border-color:var(--brass) !important; color:#fff !important; font-weight:600;}
.side-edit svg{width:15px; height:15px;}
body.editing #app{margin-right:380px;}
body.editing [data-edit]{outline:1px dashed rgba(164,117,82,.55); outline-offset:3px; cursor:text; border-radius:2px; transition:outline-color .15s, background .15s;}
body.editing [data-edit]:hover{outline-color:var(--brass); background:rgba(164,117,82,.08);}
body.editing [data-edit]:focus{outline:2px solid var(--brass); background:rgba(164,117,82,.12);}
body.editing [data-edit]:empty::before{content:'Click to add text'; opacity:.5; font-style:italic;}
body.editing .is-empty-btn{opacity:.6;}
body.editing .site-head{top:0;}
.sed{position:fixed; top:0; right:0; bottom:0; width:380px; z-index:80; background:var(--surface); border-left:1px solid var(--line); box-shadow:-20px 0 40px -30px rgba(0,0,0,.5); display:flex; flex-direction:column; font-family:'Inter',system-ui,sans-serif; color:var(--text);}
.sed-head{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); background:var(--ink); color:#fff;}
.sed-head strong{display:block; font-size:16px;}
.sed-status{display:flex; align-items:center; gap:7px; font-size:12px; color:#c9c1b2;}
.sed-tabs{display:flex; border-bottom:1px solid var(--line);}
.sed-tabs button{flex:1; border:0; background:none; padding:12px 6px; font:600 13px 'Inter',system-ui,sans-serif; color:var(--muted); border-bottom:2px solid transparent;}
.sed-tabs button[aria-selected="true"]{color:var(--text); border-bottom-color:var(--brass);}
.sed-body{flex:1; overflow-y:auto; padding:16px 18px 24px; display:grid; gap:14px; align-content:start;}
.sed-tip{display:flex; gap:10px; font-size:13px; line-height:1.5; background:var(--brass-soft); padding:12px; border-radius:4px;}
.sed-tip svg{width:18px; height:18px; flex-shrink:0; color:var(--brass); margin-top:1px;}
.sed-group{border:1px solid var(--line); border-radius:4px;}
.sed-group summary{padding:11px 12px; font-weight:600; font-size:13.5px; cursor:pointer;}
.sed-group[open] summary{border-bottom:1px solid var(--line);}
.sed-fields{display:grid; gap:12px; padding:12px;}
.sed-body > .sed-fields{padding:0;}
.sed .fld textarea{min-height:0;}
.sed-danger{border-top:1px solid var(--line); padding-top:14px;}
.sw-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.sw-row input[type=color]{width:40px; height:34px; padding:2px; border:1px solid var(--line); border-radius:4px; background:var(--surface);}
.sw{width:26px; height:26px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line); padding:0;}
.sw.on{box-shadow:0 0 0 2px var(--text);}
.sed-img{height:110px; border:1px dashed var(--line); border-radius:4px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12.5px; background:var(--paper);}
.sed-img img{width:100%; height:100%; object-fit:cover;}
.sed-img-actions{display:flex; gap:12px; align-items:center; margin-top:8px;}
.sed-file{position:relative; overflow:hidden; cursor:pointer;}
.sed-file input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.sed-secs{list-style:none; margin:0; padding:0; display:grid; gap:8px;}
.sed-secs li{border:1px solid var(--line); border-radius:4px; padding:8px 10px; background:var(--surface);}
.sed-secs li.off .sed-sec-name{opacity:.45; text-decoration:line-through;}
.sed-sec-row{display:flex; align-items:center; gap:6px;}
.sed-sec-name{flex:1; font-weight:600; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis;}
.sed-sec-name small{display:block; font-weight:400; font-size:11.5px; color:var(--muted); text-decoration:none;}
.sed-secs .icon-b{width:30px; height:30px;}
.sed-secs .icon-b[disabled]{opacity:.35; cursor:default;}
.sed-vis{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); margin:0 4px;}
.sed-sec-extra{display:grid; gap:8px; padding-top:10px; margin-top:8px; border-top:1px solid var(--line);}
.linkish.bad{color:var(--bad);}
.sed-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap;}
@media (max-width:900px){
  body.editing #app{margin-right:0; padding-bottom:58vh;}
  .sed{top:auto; left:0; width:auto; height:56vh; border-left:0; border-top:1px solid var(--line); box-shadow:0 -20px 40px -30px rgba(0,0,0,.5);}
}
body.editing .hero-inner{flex-direction:column; align-items:flex-start;}
body.editing .hero-tag{position:relative; right:auto; top:auto;}

/* ===== furniture editor ===== */
.fed-canvas{display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto;}
.fed-svg{width:100%; max-width:980px;}
.fed-svg svg{width:100%; height:auto; max-height:calc(100vh - 170px);}
.fed-svg .pl-room{cursor:pointer;}
.fed-svg .pl-room:hover{fill:#eadbc6;}
.fed-svg .pl-room.fe-sel{fill:#e3cbb0 !important;}
.fe-ov{pointer-events:none;}
.fe-f{fill:rgba(107,74,51,.5); stroke:#6b4a33; stroke-width:.08;}
.fe-bad{fill:rgba(196,52,40,.38);}
.fe-ok strong{display:flex; align-items:center; gap:6px; color:var(--ok);}
.fe-ok svg{width:16px; height:16px;}
.fe-opts{display:grid; gap:8px;}
.fe-opts label{display:flex; gap:8px; align-items:flex-start; font-size:14px; cursor:pointer;}
.fe-opts input{accent-color:var(--brass); margin-top:3px;}
.fe-opts small{display:block; color:var(--muted); font-size:12px;}
.fe-warn{color:var(--bad) !important; font-weight:600;}
.fed .bld-tip{pointer-events:none;}

/* ===== pricing ===== */
.pricing{background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.price-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); gap:20px; align-items:start;}
.price-card{background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:22px 22px 18px;}
.pc-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:6px;}
.pc-head h3{font-size:22px;}
.pc-head span{font-size:13px; color:var(--muted);}
.pc-head strong{font-family:var(--serif); font-weight:500; font-size:20px; color:var(--text);}
.pc-list{list-style:none; margin:0; padding:0;}
.pc-list li{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px dashed var(--line);}
.pc-list li:last-child{border-bottom:0;}
.pc-name{border:0; background:none; padding:0; text-align:left; font:600 14.5px var(--sans); color:var(--text); display:grid; gap:2px; min-width:0;}
.pc-name small{font-weight:400; font-size:12px; color:var(--muted);}
.pc-name:hover{color:var(--brass);}
.pc-price{font-family:var(--serif); font-size:19px; white-space:nowrap;}
.pc-checks{list-style:none; margin:10px 0 14px; padding:0; display:grid; gap:9px;}
.pc-checks li{display:flex; gap:9px; font-size:14px; line-height:1.45;}
.pc-checks svg{width:16px; height:16px; color:var(--ok); flex-shrink:0; margin-top:2px;}
.pc-fine{font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px;}
.pc-fine .linkish{font-size:12.5px;}

/* ===== review fixes ===== */
section[id], .hero{scroll-margin-top:92px;}
@media (max-width:600px){ section[id]{scroll-margin-top:78px;} }
.services{padding-top:40px;}
.modal-bg.stacked{z-index:98; background:rgba(15,17,20,.55);}
@media (max-width:900px){
  .sed{height:62vh;}
  body.editing #app{padding-bottom:64vh;}
  .sed-foot{flex-wrap:nowrap; overflow-x:auto; padding:10px 12px; gap:6px;}
  .sed-foot .btn{padding:8px 10px; font-size:11px; white-space:nowrap; flex-shrink:0;}
  .sed-head{padding:12px 14px;}
  .sed-tabs button{padding:10px 4px;}
}

/* ===================== DASHBOARD ===================== */
.dash{display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; background:linear-gradient(90deg,var(--ink) 240px,var(--paper) 240px);}
.dash-side{background:var(--ink); color:var(--on-ink); padding:22px 16px; display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100vh;}
.dash-side .brand{padding:0 8px;}
.dash-nav{display:flex; flex-direction:column; gap:2px;}
.dash-nav button{display:flex; align-items:center; gap:12px; background:transparent; border:0; color:var(--on-ink-muted); padding:10px 12px; text-align:left; font-size:14px; border-radius:3px;}
.dash-nav button svg{width:18px; height:18px;}
.dash-nav button:hover{background:var(--ink-2); color:#fff;}
.dash-nav button[aria-current="page"]{background:var(--ink-2); color:#fff; box-shadow:inset 3px 0 0 var(--brass);}
.nav-badge{margin-left:auto; background:var(--brass); color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px;}
.dash-side-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:var(--on-ink-muted); padding:0 8px;}
.dash-side-foot button{background:transparent; border:1px solid var(--ink-3); color:var(--on-ink); padding:9px 12px; border-radius:3px; font-size:13px; text-align:left;}
.dash-side-foot button:hover{border-color:var(--brass);}
.dash-side-foot .who{font-size:11.5px; line-height:1.5; margin-top:4px;}

.dash-main{min-width:0; display:flex; flex-direction:column;}
.dash-top{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line); padding:16px 32px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;}
.dash-top h1{font-size:26px;}
.dash-top .sub{font-size:13px; color:var(--muted);}
.pub{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pub-status{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ok);}
.dot.dirty{background:var(--warn);}
.dash-body{padding:28px 32px 60px; display:flex; flex-direction:column; gap:24px; max-width:1200px; width:100%;}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:4px;}
.panel-head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.panel-head h2{font-family:var(--sans); font-size:15px; font-weight:600;}
.panel-head p{font-size:13px; color:var(--muted);}
.panel-body{padding:20px;}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:18px 20px;}
.stat-label{font-size:12.5px; color:var(--muted);}
.stat-value{font-family:var(--serif); font-size:32px; line-height:1.2; margin-top:4px;}
.stat-note{font-size:12px; color:var(--muted); margin-top:2px;}
@media (max-width:1000px){ .stats{grid-template-columns:1fr 1fr;} }

.two{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:24px; align-items:start;}
@media (max-width:1000px){ .two{grid-template-columns:1fr;} }

.todo{list-style:none; margin:0; padding:0;}
.todo li{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
.todo li:last-child{border-bottom:0;}
.todo-ic{width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
.todo-ic.warn{background:var(--warn-soft); color:var(--warn);}
.todo-ic.ok{background:var(--ok-soft); color:var(--ok);}
.todo li div{flex:1;}
.todo small{display:block; color:var(--muted); font-size:12.5px;}

.quick{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.quick a{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border:1px solid var(--line); border-radius:3px; text-decoration:none; font-size:14px; font-weight:600;}
.quick a small{font-weight:400; color:var(--muted); font-size:12px;}
.quick a:hover{border-color:var(--brass);}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.toolbar .search-input{flex:1; min-width:200px;}
.toolbar input,.toolbar select{border:1px solid var(--line); background:var(--surface); padding:9px 12px; border-radius:3px; font-size:14px; width:100%;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:3px; overflow:hidden;}
.seg button{background:var(--surface); border:0; padding:8px 14px; font-size:13px; color:var(--muted);}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff;}

.table-wrap{overflow-x:auto;}
table.list{width:100%; border-collapse:collapse; font-size:14px; min-width:760px;}
table.list th{text-align:left; font-size:12px; font-weight:600; color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.list td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.list tr:last-child td{border-bottom:0;}
table.list tr:hover td{background:var(--paper);}
.lrow{display:flex; align-items:center; gap:12px;}
.thumb{width:64px; height:48px; flex-shrink:0; overflow:hidden; background:var(--ink-2); border-radius:2px;}
.thumb img,.thumb svg{width:100%; height:100%; object-fit:cover;}
.lname{font-weight:600;}
.lmeta{font-size:12.5px; color:var(--muted);}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px; border:0; white-space:nowrap;}
.pill.live{background:var(--ok-soft); color:var(--ok);}
.pill.draft{background:var(--line); color:var(--muted);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.ok{background:var(--ok-soft); color:var(--ok);}
button.pill:hover{filter:brightness(.96);}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}
.icon-b{width:34px; height:34px; border:1px solid var(--line); background:var(--surface); border-radius:3px; display:inline-flex; align-items:center; justify-content:center;}
.icon-b svg{width:16px; height:16px;}
.icon-b:hover{border-color:var(--brass); color:var(--brass);}
.icon-b.confirm{width:auto; padding:0 10px; background:var(--bad); color:#fff; border-color:var(--bad); font-size:12px; font-weight:600;}
.star{color:var(--brass);}

/* editor slide-over */
.sheet-bg{position:fixed; inset:0; background:rgba(15,17,20,.5); z-index:90;}
.sheet{position:fixed; top:0; right:0; bottom:0; width:min(620px,100vw); background:var(--surface); z-index:91; display:flex; flex-direction:column; animation:slide .22s ease; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
@keyframes slide{from{transform:translateX(30px); opacity:0;} to{transform:none; opacity:1;}}
.sheet-head{display:flex; justify-content:space-between; align-items:center; padding:18px 24px; border-bottom:1px solid var(--line);}
.sheet-head h2{font-size:22px;}
.sheet-body{flex:1; overflow-y:auto; padding:22px 24px; display:grid; gap:16px; align-content:start;}
.sheet-foot{padding:14px 24px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
@media (max-width:520px){ .grid3{grid-template-columns:1fr 1fr;} }
.fld .hint{font-size:12px; color:var(--muted);}
.fld .err{font-size:12px; color:var(--bad);}
.fld textarea{min-height:100px; resize:vertical;}
.drop{border:1.5px dashed var(--line); border-radius:4px; padding:14px; display:flex; gap:14px; align-items:center; background:var(--paper); position:relative;}
.drop.over{border-color:var(--brass); background:var(--brass-soft);}
.drop .prev{width:120px; aspect-ratio:4/3; overflow:hidden; background:var(--ink-2); flex-shrink:0; border-radius:2px;}
.drop .prev img,.drop .prev svg{width:100%; height:100%; object-fit:cover;}
.drop .prev.plan img{object-fit:contain; background:#fff;}
.drop-text{font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
.drop-text strong{color:var(--text);}
.drop input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
.drop .linkish{position:relative; z-index:2;}
.switch-row{display:flex; gap:20px; flex-wrap:wrap;}
.switch{display:flex; align-items:center; gap:8px; font-size:14px;}
.switch input{width:18px; height:18px; accent-color:var(--brass);}

.steps-list{margin:0; padding-left:20px; display:grid; gap:10px; font-size:14px;}
.steps-list li::marker{color:var(--brass); font-weight:700;}
.callout{background:var(--brass-soft); border-left:3px solid var(--brass); padding:14px 16px; font-size:13.5px; border-radius:0 3px 3px 0;}
.muted{color:var(--muted);}

@media (max-width:860px){
  .dash{grid-template-columns:1fr; background:var(--paper);}
  .dash-side{position:static; height:auto; padding:14px; gap:12px;}
  .dash-nav{flex-direction:row; overflow-x:auto;}
  .dash-nav button{white-space:nowrap;}
  .dash-side-foot{flex-direction:row; margin-top:0; padding:0;}
  .dash-side-foot .who{display:none;}
  .dash-top{padding:14px 18px; position:static;}
  .dash-body{padding:20px 18px 50px;}
  .quick{grid-template-columns:1fr;}
}
</style>
</head>

<script id="site-js">/* ===== GianCO plan generator: specs -> room layout, 2D plan SVG ===== */
(function(){
'use strict';

var LH = 10, WH = 9;
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function sum(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }

var plan_xc = [0,0];
var AREA = {hall:0,great:360,kitchen:210,dining:150,foyer:80,office:125,primary:235,pbath:110,closet:65,bed:140,bath:55,powder:32,mud:70,laundry:55,loft:170,landing:95,stairs:60,guest:150,gbath:50};
var NAMES = {great:'Great Room',kitchen:'Kitchen',dining:'Dining',foyer:'Entry',office:'Office',primary:'Primary Suite',pbath:'Primary Bath',closet:'Walk-in Closet',bed:'Bedroom',bath:'Bath',powder:'Powder',mud:'Mudroom',laundry:'Laundry',loft:'Loft',landing:'Landing',stairs:'Stairs',guest:'Guest Suite',gbath:'Guest Bath',garage:'Garage',hall:'Hall',patio:'Patio'};
function C(t, n){ return {t:t, n:n || NAMES[t], a:AREA[t]}; }

function parseSpecs(l){
  var stories = /2/.test(String(l.stories || '')) ? 2 : 1;
  var beds = clamp(Math.round(Number(l.beds) || 3), 1, 7);
  var baths = clamp(Number(l.baths) || 2, 1, 7);
  var full = Math.max(1, Math.floor(baths));
  var half = (baths - Math.floor(baths)) >= 0.5 ? 1 : 0;
  var sqft = clamp(Number(l.sqft) || 2000, 800, 7000);
  var g = String(l.garage || '');
  var cars = /none|no /i.test(g) ? 0 : (parseInt(g, 10) || (g.trim() ? 2 : 0));
  cars = clamp(cars, 0, 4);
  return {stories:stories, beds:beds, full:full, half:half, sqft:sqft, cars:cars, style:String(l.style||'')};
}

/* ---------- program: levels -> columns -> rows -> cells ---------- */
function specOne(p){
  var L=[], Hc=[], Cc=[], R=[];
  var sec = p.beds - 1, secBaths = p.full > 1 ? p.full - 1 : 0;
  var pair = sec >= 3;
  for(var i=0;i<sec;i++){
    var bn = secBaths > 1 ? 'Bath ' + (i+2) : 'Hall Bath';
    if(pair) L.push({cells: i < secBaths ? [C('bath', bn), C('bed', 'Bedroom ' + (i+2))] : [C('bed', 'Bedroom ' + (i+2))]});
    else { L.push({cells:[C('bed', 'Bedroom ' + (i+2))]}); if(i < secBaths) L.push({cells:[C('bath', bn)]}); }
  }
  if(p.full === 1) L.splice(Math.min(1, L.length), 0, {cells:[C('bath')]});
  if(L.length < 2) L.push({cells:[C('office', 'Flex Room')]});
  if(p.half) Hc.push({cells:[C('powder')], fixedH:7});
  Hc.push({cells:[C('hall')]});
  Cc.push({cells:[C('office'), C('foyer')]});
  Cc.push({cells:[C('great')]});
  Cc.push({cells:[C('dining'), C('kitchen')]});
  R.push({cells:[C('mud','Mudroom / Laundry')], fixedH:7});
  R.push({cells:[C('primary')]});
  R.push({cells: p.full > 1 ? [C('closet'), C('pbath')] : [C('closet')]});
  return {fixedW:[0,4,0,0], levels:[[L, Hc, Cc, R]]};
}
function specTwo(p){
  var guest = p.beds >= 5 ? 1 : 0;
  var L1=[], C1=[], R1=[], L2=[], C2=[], R2=[];
  L1.push({cells: guest ? [C('gbath'), C('guest')] : [C('office')]});
  L1.push({cells:[C('dining')]});
  C1.push({cells:[C('stairs'), C('foyer')], stairsRow:true});
  C1.push({cells:[C('great')]});
  R1.push({cells: p.half ? [C('powder'), C('mud')] : [C('mud')], fixedH:8});
  R1.push({cells:[C('kitchen')]});
  var sec = p.beds - 1 - guest, secBaths = Math.max(0, p.full - 1 - guest);
  var rows = [];
  for(var i=0;i<sec;i++){
    var bn = 'Bath ' + (i+2), bd = 'Bedroom ' + (i+2 + guest);
    if(p.stack){ rows.push({cells:[C('bed', bd)]}); if(i < secBaths) rows.push({cells:[C('bath', bn)]}); }
    else rows.push({cells: i < secBaths ? [C('bath', bn), C('bed', bd)] : [C('bed', bd)]});
  }
  var extra = null;
  if(rows.length > (p.stack ? 5 : 3)){ extra = rows.pop(); if(rows.length && rows[rows.length-1].cells[0].t === 'bath' && p.stack){ /* keep bath with its bedroom */ } }
  L2 = rows.length ? rows : [{cells:[C('loft','Bonus Room')]}];
  C2.push({cells:[C('landing')], landingRow:true});
  C2.push({cells:[C('loft')]});
  if(extra) C2.push({cells: extra.cells});
  R2.push({cells:[C('laundry')], fixedH:6});
  R2.push({cells:[C('primary')]});
  R2.push({cells:[C('closet'), C('pbath')]});
  return {fixedW:[0,0,0], levels:[[L1, C1, R1], [L2, C2, R2]]};
}

/* ---------- geometry ---------- */
function generate(listing){
  var p = parseSpecs(listing);
  p.stack = !!listing.__stack;
  var spec = p.stories === 2 ? specTwo(p) : specOne(p);
  var prog = spec.levels, NC = spec.fixedW.length;
  var A = Math.max(p.sqft, prog.length === 2 ? Math.max(1700, p.beds * 380) : 0) / prog.length;
  var D = clamp(Math.round(Math.sqrt(A / (prog.length === 1 ? 1.75 : 1.4))), 24, 52);
  var colA = spec.fixedW.map(function(){ return 0; });
  prog.forEach(function(cols){ cols.forEach(function(rows, ci){
    var s = 0; rows.forEach(function(r){ r.cells.forEach(function(c){ s += c.a; }); });
    colA[ci] = Math.max(colA[ci], s);
  }); });
  var fixedTot = sum(spec.fixedW), Wf = A / D - fixedTot, flexA = 0;
  colA.forEach(function(a, i){ if(!spec.fixedW[i]) flexA += a; });
  var widths = colA.map(function(a, i){ return spec.fixedW[i] || a / flexA * Wf; });
  // keep side wings livable: at least 11 ft wide, borrowed from the center
  var ctr = NC - 2;
  [0, NC - 1].forEach(function(i){ if(widths[i] < 11){ widths[ctr] -= 11 - widths[i]; widths[i] = 11; } });
  var xb = [0], acc = 0;
  widths.forEach(function(w){ acc += w; xb.push(Math.round(acc)); });
  var W = xb[NC];
  if(p.stories === 2 && !p.stack && widths[0] < 15){ var l2 = Object.assign({}, listing); l2.__stack = true; return generate(l2); }

  var stairsH = 0;
  prog.forEach(function(cols){
    cols.forEach(function(rows, ci){
      var x0 = xb[ci], x1 = xb[ci+1], cw = x1 - x0;
      rows.forEach(function(r){ if(r.landingRow && stairsH) r.fixedH = stairsH; });
      var fixed = 0, wsum = 0;
      rows.forEach(function(r){ var a = sum(r.cells.map(function(c){ return c.a; })); r.area = a; if(r.fixedH) fixed += r.fixedH; else wsum += a; });
      var free = D - fixed, za = 0, zp = 0;
      rows.forEach(function(r, ri){
        za += r.fixedH ? r.fixedH : r.area / wsum * free;
        var z1 = ri === rows.length - 1 ? D : Math.round(za);
        r.z0 = zp; r.z1 = z1; zp = z1;
        if(r.stairsRow) stairsH = z1 - r.z0;
        var cacc = 0, cp = x0;
        r.cells.forEach(function(c, k){
          cacc += c.a / r.area * cw;
          var cx1 = k === r.cells.length - 1 ? x1 : x0 + Math.round(cacc);
          c.x0 = cp; c.x1 = cx1; c.z0 = r.z0; c.z1 = r.z1; cp = cx1;
        });
      });
    });
  });
  plan_xc = [xb[NC-2], xb[NC-1]];

  var gw = p.cars >= 3 ? 33 : p.cars === 2 ? 23 : p.cars === 1 ? 13 : 0;
  var gd = gw ? 24 : 0;
  var GW = W + gw, GD = Math.max(D, gd);
  var plan = {W:W, D:D, GW:GW, GD:GD, stories:prog.length, specs:p, rooms:[], levels:[], xb:xb, LH:LH, WH:WH};

  function newRoom(t, n, lv){ var r = {id:plan.rooms.length, t:t, n:n, level:lv, cells:0}; plan.rooms.push(r); return r; }
  prog.forEach(function(cols, li){
    var owner = new Int16Array(GW * GD); owner.fill(-1);
    var lvl = {index:li, y:li * LH, owner:owner, rooms:[]};
    cols.forEach(function(rows){ rows.forEach(function(r){ r.cells.forEach(function(c){
      var rm = newRoom(c.t, c.n, li); lvl.rooms.push(rm.id);
      for(var z=c.z0; z<c.z1; z++) for(var x=c.x0; x<c.x1; x++) owner[z*GW + x] = rm.id;
    }); }); });
    plan.levels.push(lvl);
  });
  if(gw){
    var gr = newRoom('garage', p.cars + '-car Garage', 0); plan.levels[0].rooms.push(gr.id);
    for(var z=0; z<gd; z++) for(var x=W; x<GW; x++) plan.levels[0].owner[z*GW + x] = gr.id;
    plan.garage = {x0:W, z0:0, x1:GW, z1:gd, cars:p.cars};
  }
  // stairs: carve the lower stair footprint into the upper floor
  var st = plan.rooms.filter(function(r){ return r.t === 'stairs'; })[0];
  if(st && plan.levels[1]){
    var o0 = plan.levels[0].owner, o1 = plan.levels[1].owner, sr = newRoom('stairs', 'Stairs', 1);
    plan.levels[1].rooms.push(sr.id);
    for(var i=0;i<o0.length;i++) if(o0[i] === st.id) o1[i] = sr.id;
    sr.hole = true;
  }
  roomStats(plan);
  plan.stairs = st ? {x0:st.x0, z0:st.z0, x1:st.x1, z1:st.z1, lower:st.id, upper:plan.rooms.filter(function(r){ return r.t==='stairs' && r.level===1; })[0].id} : null;
  // porch + patio
  var cx0 = plan_xc[0], cx1 = plan_xc[1];
  plan.porch = {x0:cx0 - 1, x1:cx1 + 1, z0:-7, z1:0};
  plan.patio = {x0:cx0 + 1, x1:cx1 - 1, z0:D, z1:D + 11};
  plan.levels.forEach(function(lv){ connect(plan, lv); });
  plan.levels.forEach(function(lv){ buildWalls(plan, lv); });
  return plan;
}

function roomStats(plan){
  var GW = plan.GW, GD = plan.GD;
  plan.levels.forEach(function(lv){
    var o = lv.owner;
    lv.rooms.forEach(function(id){ var r = plan.rooms[id]; r.x0 = 1e9; r.z0 = 1e9; r.x1 = -1; r.z1 = -1; r.cells = 0; r.sx = 0; r.sz = 0; });
    for(var z=0; z<GD; z++) for(var x=0; x<GW; x++){
      var id = o[z*GW + x]; if(id < 0) continue;
      var r = plan.rooms[id]; r.cells++; r.sx += x + .5; r.sz += z + .5;
      if(x < r.x0) r.x0 = x; if(z < r.z0) r.z0 = z; if(x+1 > r.x1) r.x1 = x+1; if(z+1 > r.z1) r.z1 = z+1;
    }
    lv.rooms = lv.rooms.filter(function(id){ return plan.rooms[id].cells > 0; });
    lv.rooms.forEach(function(id){
      var r = plan.rooms[id], cx = r.sx / r.cells, cz = r.sz / r.cells, best = null, bd = 1e9;
      for(var z=r.z0; z<r.z1; z++) for(var x=r.x0; x<r.x1; x++){
        if(o[z*GW+x] !== id) continue;
        var d = (x+.5-cx)*(x+.5-cx) + (z+.5-cz)*(z+.5-cz); if(d < bd){ bd = d; best = [x+.5, z+.5]; }
      }
      r.cx = best[0]; r.cz = best[1]; r.w = r.x1 - r.x0; r.d = r.z1 - r.z0;
    });

}

/* ---------- adjacency + connections ---------- */
var OPEN = {'great|kitchen':1,'dining|great':1,'foyer|great':1,'dining|kitchen':1,'dining|foyer':1,'foyer|stairs':1,'great|stairs':1,'landing|loft':1,'landing|stairs':1,'loft|stairs':1};
var ARCH = {'great|hall':1,'foyer|hall':1};
var PREF = {
  hall:['great','foyer'],
  patio:['great','dining','kitchen','primary','foyer','hall'],
  bed:['hall','landing','loft','great','foyer','dining','office','kitchen'],
  guest:['foyer','great','dining','office','landing'],
  primary:['hall','landing','loft','great','foyer','dining','office','kitchen','mud'],
  bath:['hall','bed','landing','loft','great','foyer','dining'],
  gbath:['guest','foyer','great'],
  pbath:['primary','closet'],
  closet:['primary','pbath'],
  powder:['hall','foyer','mud','great','kitchen','dining','landing','loft'],
  mud:['kitchen','foyer','great','dining','office'],
  laundry:['loft','landing','hall','kitchen','great'],
  office:['foyer','hall','great','dining','landing','loft'],
  garage:['mud','kitchen','laundry','foyer'],
  foyer:['great','stairs','dining','office'],
  great:['kitchen','dining','foyer','stairs'],
  kitchen:['great','dining','mud'],
  dining:['great','kitchen','foyer'],
  loft:['landing','stairs'],
  landing:['stairs','loft'],
  stairs:['foyer','great','landing','loft']
};
function pairKey(a, b){ return a < b ? a + '|' + b : b + '|' + a; }
function pairKey2(a, b){ return a < b ? a + '|' + b : b + '|' + a; }
function isOpen(ta, tb){ return !!OPEN[ta < tb ? ta + '|' + tb : tb + '|' + ta]; }

function connect(plan, lv){
  var GW = plan.GW, GD = plan.GD, o = lv.owner, R = plan.rooms, shared = {};
  function add(a, b, e){ if(a < 0 || b < 0 || a === b) return; var k = pairKey(a,b); (shared[k] || (shared[k] = [])).push(e); }
  for(var z=0; z<GD; z++) for(var x=1; x<GW; x++) add(o[z*GW+x-1], o[z*GW+x], {o:'v', k:x, t:z});
  for(var z2=1; z2<GD; z2++) for(var x2=0; x2<GW; x2++) add(o[(z2-1)*GW+x2], o[z2*GW+x2], {o:'h', k:z2, t:x2});
  var runs = {};
  Object.keys(shared).forEach(function(k){
    var best = null, byLine = {};
    shared[k].forEach(function(e){ var lk = e.o + e.k; (byLine[lk] || (byLine[lk] = {o:e.o, k:e.k, ts:[]})).ts.push(e.t); });
    Object.keys(byLine).forEach(function(lk){
      var L = byLine[lk]; L.ts.sort(function(a,b){ return a-b; });
      var s = L.ts[0], prev = s;
      for(var i=1; i<=L.ts.length; i++){
        if(i < L.ts.length && L.ts[i] === prev + 1){ prev = L.ts[i]; continue; }
        var len = prev + 1 - s;
        if(!best || len > best.len) best = {o:L.o, k:L.k, t0:s, t1:prev+1, len:len};
        if(i < L.ts.length){ s = L.ts[i]; prev = s; }
      }
    });
    runs[k] = best;
  });
  lv.adj = runs;
  var conns = [], have = {};
  function neighbors(id){
    var out = [];
    Object.keys(runs).forEach(function(k){ var ab = k.split('|').map(Number); if(ab[0] === id) out.push(ab[1]); else if(ab[1] === id) out.push(ab[0]); });
    return out;
  }
  function link(a, b, kind){
    var k = pairKey(a,b); if(have[k]) return false;
    var run = runs[k]; if(!run || run.len < 3) return false;
    var s0, s1;
    if(kind === 'arch'){ var aw = Math.min(4.5, run.len); s0 = (run.t0 + run.t1 - aw) / 2; s1 = s0 + aw; kind = 'open'; }
    else if(kind === 'open'){
      if(R[a].t === 'stairs' || R[b].t === 'stairs' || run.len <= 5){ s0 = run.t0; s1 = run.t1; }
      else { s0 = run.t0 + 1; s1 = run.t1 - 1; }
    } else {
      var w = run.len >= 3.6 ? 3 : run.len - 0.6;
      if(run.len >= 7){ s0 = run.t0 + 1; s1 = s0 + w; } else { s0 = (run.t0 + run.t1 - w) / 2; s1 = s0 + w; }
    }
    have[k] = 1;
    conns.push({a:a, b:b, kind:kind, o:run.o, k:run.k, s0:s0, s1:s1, level:lv.index});
    return true;
  }
  lv.rooms.forEach(function(id){
    var r = R[id], pref = PREF[r.t] || [], nb = neighbors(id), doorDone = false;
    pref.forEach(function(t){
      nb.forEach(function(n){
        if(R[n].t !== t) return;
        if(ARCH[pairKey2(r.t, t)]) link(id, n, 'arch');
        else if(isOpen(r.t, t)) link(id, n, 'open');
        else if(!doorDone){ if(link(id, n, 'door')) doorDone = true; else if(have[pairKey(id,n)]) doorDone = true; }
      });
    });
  });
  // make sure every room is reachable
  var start = lv.rooms.filter(function(id){ return R[id].t === (lv.index === 0 ? 'foyer' : 'landing'); })[0];
  if(start === undefined) start = lv.rooms[0];
  var CIRC = {hall:1, great:1, foyer:1, landing:1, loft:1, kitchen:1, dining:1, stairs:1};
  for(var pass=0; pass<20; pass++){
    var seen = {}; seen[start] = 1; var q = [start];
    while(q.length){ var c = q.shift(); conns.forEach(function(cn){ var n = cn.a === c ? cn.b : cn.b === c ? cn.a : -1; if(n >= 0 && !seen[n]){ seen[n] = 1; q.push(n); } }); }
    var miss = lv.rooms.filter(function(id){ return !seen[id]; });
    if(!miss.length) break;
    var fixed = false;
    miss.some(function(id){
      var cands = neighbors(id).filter(function(n){ return seen[n] && runs[pairKey(id,n)].len >= 3; });
      cands.sort(function(a,b){ return (CIRC[R[b].t]?1:0) - (CIRC[R[a].t]?1:0); });
      if(cands.length){ link(id, cands[0], isOpen(R[id].t, R[cands[0]].t) ? 'open' : 'door'); fixed = true; return true; }
      return false;
    });
    if(!fixed) break;
  }
  lv.conns = conns;
}

/* ---------- walls, windows, exterior doors ---------- */
function buildWalls(plan, lv){
  var GW = plan.GW, GD = plan.GD, o = lv.owner, R = plan.rooms;
  function own(x, z){ return (x < 0 || z < 0 || x >= GW || z >= GD) ? -1 : o[z*GW + x]; }
  var walls = [], ext = {};
  // vertical lines x = k (units along z), horizontal z = k (units along x)
  function scan(orient){
    var K = orient === 'v' ? GW : GD, T = orient === 'v' ? GD : GW;
    for(var k=0; k<=K; k++){
      var cur = null;
      for(var t=0; t<=T; t++){
        var a = -1, b = -1, wall = false, side = 0;
        if(t < T){
          if(orient === 'v'){ a = own(k-1, t); b = own(k, t); } else { a = own(t, k-1); b = own(t, k); }
          wall = a !== b && (a >= 0 || b >= 0);
          if(wall && lv.index === 1 && plan.stairs){
            // no wall between stairs hole and outside? keep; hole edges become rails via open conns
          }
          side = !wall ? 0 : (a < 0 ? -1 : b < 0 ? 1 : 0);
          if(wall && side !== 0){
            var rid = a < 0 ? b : a;
            var key = rid + orient + k;
            (ext[key] || (ext[key] = {room:rid, o:orient, k:k, side:side, ts:[]})).ts.push(t);
          }
        }
        if(cur && (!wall || side !== cur.ext)){ cur.t1 = t; walls.push(cur); cur = null; }
        if(wall && !cur) cur = {o:orient, k:k, t0:t, t1:t+1, ext:side, level:lv.index, open:[]};
      }
    }
  }
  scan('v'); scan('h');
  lv.walls = walls;
  var ops = [];
  lv.conns.forEach(function(c){ ops.push({o:c.o, k:c.k, s0:c.s0, s1:c.s1, kind:c.kind, a:c.a, b:c.b}); });
  if(lv.extOps){ lv.extOps.forEach(function(op){ ops.push(op); }); attachOps(walls, ops); lv.ops = ops; return; }
  // exterior openings per room run
  var target = null;
  if(lv.index === 0){
    ['great','dining','kitchen'].some(function(t){
      return Object.keys(ext).some(function(key){ var e = ext[key]; if(R[e.room].t === t && e.o === 'h' && e.k === plan.D && e.ts.length >= 8){ target = key; return true; } return false; });
    });
  }
  Object.keys(ext).forEach(function(key){
    var e = ext[key], r = R[e.room]; e.ts.sort(function(a,b){ return a-b; });
    var s = e.ts[0], prev = s, rr = [];
    for(var i=1; i<=e.ts.length; i++){
      if(i < e.ts.length && e.ts[i] === prev + 1){ prev = e.ts[i]; continue; }
      rr.push([s, prev + 1]); if(i < e.ts.length){ s = e.ts[i]; prev = s; }
    }
    rr.forEach(function(run){
      var t0 = run[0], t1 = run[1], len = t1 - t0, mid = (t0 + t1) / 2;
      function win(c, w, sill, head, kind){ ops.push({o:e.o, k:e.k, s0:c - w/2, s1:c + w/2, kind:kind || 'window', sill:sill, head:head, room:e.room}); }
      var isFront = e.o === 'h' && e.k === 0;
      if(r.t === 'garage'){
        if(isFront){
          var bays = plan.specs.cars, dw = bays >= 2 ? 16 : 9;
          if(bays >= 3){ win(t0 + 1.5 + 8, 16, 0, 8, 'garagedoor'); win(t1 - 1.5 - 4.5, 9, 0, 8, 'garagedoor'); }
          else win(mid, Math.min(dw, len - 3), 0, 8, 'garagedoor');
        } else if(len >= 6 && e.o === 'v') win(mid, 3, 4, 7);
        return;
      }
      if(r.t === 'foyer' && isFront && len >= 4){
        win(mid, 3.5, 0, 8, 'frontdoor');
        if(len >= 9){ win(mid - 3.2, 1.4, 0.5, 8, 'window'); win(mid + 3.2, 1.4, 0.5, 8, 'window'); }
        return;
      }
      if(key === target){
        var sw = Math.min(10, len - 3); win(mid, sw, 0, 8, 'slider');
        return;
      }
      if(r.t === 'patio'){ if(len >= 5) win(mid, Math.min(len - 2, 14), 0, 8, 'slider'); return; }
      if(/bath|powder/.test(r.t)){ if(len >= 4) win(mid, 2.5, 5, 7); return; }
      if(r.t === 'closet' || r.t === 'stairs') return;
      if(r.t === 'kitchen'){ if(len >= 6) win(mid, 4.5, 3.6, 7); return; }
      var wW = (r.t === 'great' || r.t === 'dining' || r.t === 'loft') ? 3.5 : 3;
      var n = len >= 17 ? 3 : len >= 11 ? 2 : len >= 5 ? 1 : 0;
      if(r.t !== 'great' && r.t !== 'loft' && n > 2) n = 2;
      for(var j=0; j<n; j++) win(t0 + len * (j + 1) / (n + 1), wW, r.t === 'great' ? 1.5 : 2.6, 7.5);
    });
  });
  attachOps(walls, ops);
  lv.ops = ops;
}
function attachOps(walls, ops){
  ops.forEach(function(op){
    walls.some(function(w){
      if(w.o === op.o && w.k === op.k && op.s0 >= w.t0 - 0.01 && op.s1 <= w.t1 + 0.01){ w.open.push(op); return true; }
      return false;
    });
  });
  walls.forEach(function(w){ w.open.sort(function(a,b){ return a.s0 - b.s0; }); });
}

/* =================================================================
   2D PLAN SVG
   ================================================================= */
var FILL = {patio:'#e2ded5',hall:'#e9e0cf',great:'#efe6d6',kitchen:'#ece2cf',dining:'#efe6d6',foyer:'#e9e0cf',office:'#e6ddcd',primary:'#e4dccd',pbath:'#dfe3e2',closet:'#e3dbcc',bed:'#e8e0d0',bath:'#dfe3e2',powder:'#dfe3e2',mud:'#e3ddd1',laundry:'#e3ddd1',loft:'#ebe2d2',landing:'#e9e0cf',stairs:'#e2d7c3',guest:'#e8e0d0',gbath:'#dfe3e2',garage:'#dcd8d0'};
function escT(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function f(n){ return Math.round(n * 100) / 100; }

function svg(plan, opts){
  opts = opts || {};
  var lvIdx = opts.level || 0, lv = plan.levels[lvIdx], mini = !!opts.mini, R = plan.rooms;
  var GW = plan.GW, GD = plan.GD, o = lv.owner;
  var padB = (lvIdx === 0 && plan.porch) ? 8 : 1.5;
  function Y(z){ return GD - z; }
  var vb = [-2, -1.5 - (lvIdx === 0 ? 0 : 0), GW + 4, GD + padB + 1.5];
  var out = [];
  if(!opts.bare) out.push('<svg class="plan-svg' + (mini ? ' mini' : '') + '" viewBox="' + vb.join(' ') + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + escT(opts.label || 'Floor plan') + '">');
  // porch/patio
  if(lvIdx === 0 && !mini && plan.porch){
    var P = plan.porch; out.push('<rect x="'+P.x0+'" y="'+Y(P.z1)+'" width="'+(P.x1-P.x0)+'" height="'+(P.z1-P.z0)+'" class="pl-porch"/>');
    out.push('<text x="'+((P.x0+P.x1)/2)+'" y="'+(Y(P.z0) - 2.6)+'" class="pl-sub" text-anchor="middle">Covered porch</text>');
  }
  // room fills (row runs)
  lv.rooms.forEach(function(id){
    var r = R[id], parts = [];
    for(var z=r.z0; z<r.z1; z++){
      var x = r.x0;
      while(x < r.x1){
        if(o[z*GW+x] !== id){ x++; continue; }
        var s = x; while(x < r.x1 && o[z*GW+x] === id) x++;
        parts.push('M'+s+' '+Y(z+1)+'h'+(x-s)+'v1h'+(s-x)+'z');
      }
    }
    var fill = r.hole ? '#d6cdbd' : (FILL[r.t] || '#ece4d6');
    out.push('<path class="pl-room" data-room="'+id+'" d="'+parts.join('')+'" fill="'+fill+'"/>');
  });
  // stairs treads
  if(plan.stairs){
    var S = plan.stairs, fw = Math.min(4, S.x1 - S.x0 - 0.4), sx = S.x1 - 0.2 - fw;
    var steps = 14, len = S.z1 - S.z0 - 0.4;
    for(var i=1; i<steps; i++){ var zz = S.z0 + 0.2 + len * i / steps; out.push('<line x1="'+f(sx)+'" x2="'+f(sx+fw)+'" y1="'+f(Y(zz))+'" y2="'+f(Y(zz))+'" class="pl-tread"/>'); }
    out.push('<path d="M'+f(sx+fw/2)+' '+f(Y(S.z1-0.8))+'V'+f(Y(S.z0+1.2))+'" class="pl-arrow"/>');
    out.push('<path d="M'+f(sx+fw/2-0.6)+' '+f(Y(S.z0+1.9))+'L'+f(sx+fw/2)+' '+f(Y(S.z0+1.1))+'L'+f(sx+fw/2+0.6)+' '+f(Y(S.z0+1.9))+'" class="pl-arrow"/>');
  }
  // walls
  var wt = mini ? 0.55 : 0.5, et = mini ? 0.9 : 0.8;
  lv.walls.forEach(function(w){
    var pieces = [], cur = w.t0;
    w.open.forEach(function(op){ if(op.s0 > cur) pieces.push([cur, op.s0]); cur = Math.max(cur, op.s1); });
    if(w.t1 > cur) pieces.push([cur, w.t1]);
    var th = w.ext ? et : wt;
    pieces.forEach(function(p){
      if(w.o === 'v') out.push('<line x1="'+w.k+'" x2="'+w.k+'" y1="'+f(Y(p[0]))+'" y2="'+f(Y(p[1]))+'" stroke-width="'+th+'" class="pl-wall"/>');
      else out.push('<line y1="'+Y(w.k)+'" y2="'+Y(w.k)+'" x1="'+f(p[0])+'" x2="'+f(p[1])+'" stroke-width="'+th+'" class="pl-wall"/>');
    });
    if(mini) return;
    w.open.forEach(function(op){
      var a = op.s0, b = op.s1;
      function L(t0, t1, cls, sw){ if(w.o === 'v') out.push('<line x1="'+w.k+'" x2="'+w.k+'" y1="'+f(Y(t0))+'" y2="'+f(Y(t1))+'" class="'+cls+'"'+(sw?' stroke-width="'+sw+'"':'')+'/>'); else out.push('<line y1="'+Y(w.k)+'" y2="'+Y(w.k)+'" x1="'+f(t0)+'" x2="'+f(t1)+'" class="'+cls+'"'+(sw?' stroke-width="'+sw+'"':'')+'/>'); }
      if(op.kind === 'window' || op.kind === 'slider'){ L(a, b, 'pl-win', th); L(a, b, 'pl-glass'); }
      else if(op.kind === 'garagedoor'){ L(a, b, 'pl-gdoor'); }
      else if(op.kind === 'door' || op.kind === 'frontdoor'){
        // swing into room b (or inward for front door)
        var dir = 1;
        if(op.kind === 'door'){
          var rb = R[op.b]; dir = (w.o === 'v' ? (rb.cx > w.k ? 1 : -1) : (rb.cz > w.k ? 1 : -1));
        } else dir = 1;
        var wd = b - a;
        if(w.o === 'h'){
          var y0 = Y(w.k), y1 = Y(w.k + dir * wd);
          out.push('<path d="M'+f(a)+' '+f(y0)+'L'+f(a)+' '+f(y1)+'M'+f(a)+' '+f(y1)+'A'+f(wd)+' '+f(wd)+' 0 0 '+(dir>0?1:0)+' '+f(b)+' '+f(y0)+'" class="pl-swing"/>');
        } else {
          var x1 = w.k + dir * wd;
          out.push('<path d="M'+w.k+' '+f(Y(a))+'L'+f(x1)+' '+f(Y(a))+'M'+f(x1)+' '+f(Y(a))+'A'+f(wd)+' '+f(wd)+' 0 0 '+(dir>0?0:1)+' '+w.k+' '+f(Y(b))+'" class="pl-swing"/>');
        }
      }
    });
  });
  // labels
  if(!mini){
    var fs = Math.max(1.25, GW / 48);
    var ABBR = {'Walk-in Closet':'WIC','Primary Bath':'Pri. Bath','Primary Suite':'Primary','Mudroom / Laundry':'Mud / Laundry','Guest Bath':'G. Bath','Hall Bath':'Bath','Great Room':'Great Rm'};
    lv.rooms.forEach(function(id){
      var r = R[id]; if(r.hole) return;
      var name = r.n, fsz = fs, cw = 0.66;
      function tw(n, sz){ return n.length * sz * cw; }
      var room = r.w - 1, rot = false;
      if(tw(name, fsz) > room && r.d > r.w * 1.5 && tw(name, fsz * 0.85) < r.d - 1){ rot = true; fsz = fs * 0.85; }
      else {
        if(tw(name, fsz) > room && ABBR[name]) name = ABBR[name];
        if(tw(name, fsz) > room) fsz = Math.max(fs * 0.62, room / (name.length * cw));
      }
      var showDim = !rot && r.cells >= 60 && r.w >= 9 && r.cells >= r.w * r.d * 0.9;
      var tx = r.cx, ty = Y(r.cz);
      if(rot){
        out.push('<text x="'+f(tx)+'" y="'+f(ty)+'" class="pl-label" font-size="'+f(fsz)+'" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 '+f(tx)+' '+f(ty)+')">'+escT(name)+'</text>');
        return;
      }
      out.push('<text x="'+f(tx)+'" y="'+f(ty - (showDim ? 0.15 : -fsz*0.35))+'" class="pl-label" font-size="'+f(fsz)+'" text-anchor="middle">'+escT(name)+'</text>');
      if(showDim) out.push('<text x="'+f(tx)+'" y="'+f(ty + fsz*1.1)+'" class="pl-dim" font-size="'+f(fs*0.78)+'" text-anchor="middle">'+r.w+'\u2032 \u00d7 '+r.d+'\u2032</text>');
    });
    if(plan.stairs && lvIdx === 1){ var S2 = plan.stairs; out.push('<text x="'+f((S2.x0+S2.x1)/2 - 1.2)+'" y="'+f(Y((S2.z0+S2.z1)/2))+'" class="pl-sub" font-size="'+f(fs*0.7)+'" text-anchor="middle" transform="rotate(-90 '+f((S2.x0+S2.x1)/2 - 1.2)+' '+f(Y((S2.z0+S2.z1)/2))+')">Open to below</text>'); }
    // scale bar
    var sy = GD + padB - 0.6;
    if(!opts.bare) out.push('<g class="pl-scale"><line x1="0" x2="10" y1="'+sy+'" y2="'+sy+'"/><line x1="0" x2="0" y1="'+(sy-0.6)+'" y2="'+(sy+0.6)+'"/><line x1="10" x2="10" y1="'+(sy-0.6)+'" y2="'+(sy+0.6)+'"/><text x="11" y="'+(sy+0.45)+'" font-size="'+f(fs*0.72)+'">10 ft</text></g>');
  }
  if(!opts.bare) out.push('</svg>');
  return out.join('');
}


/* =================================================================
   CUSTOM LAYOUTS (drawn by the owner in the floor plan builder)

    });

function stats(){
  var L = state.listings;

  var prices = live.map(function(l){ return l.price; });
  return {
    total:L.length, live:live.length, drafts:L.length-live.length,
    ready:ready.length, missing:live.length-ready.length,
    noPhoto:live.filter(function(l){ return !l.image; }).length,
    avg: prices.length ? Math.round(prices.reduce(function(a,b){return a+b;},0)/prices.length) : 0,
    min: prices.length ? Math.min.apply(null,prices) : 0,
    max: prices.length ? Math.max.apply(null,prices) : 0
  };
}
function changeCount(){
  var a = PUBLISHED.listings, b = state.listings, n = 0;
  var ids = {};

  if(JSON.stringify(PUBLISHED.settings) !== JSON.stringify(state.settings)) n++;

  return n;
}

function saveSvc(){
  var sh = document.getElementById('sheet'); if(!sh || !svcEditor) return;

  state.services = state.services || [];

    var k = ev.target.getAttribute('data-f');
    storeFilter[k] = (k === 'stories' || k === 'style' || k === 'sort') ? ev.target.value : Number(ev.target.value);

  }
});
document.addEventListener('submit', function(ev){

document.addEventListener('keydown', function(ev){
  var et = ev.target;
  if(editMode && et && et.hasAttribute && et.hasAttribute('data-edit')){
    if(ev.key === 'Enter' && !et.classList.contains('ml')){ ev.preventDefault(); et.blur(); }
    if(ev.key === 'Escape'){ ev.preventDefault(); et.blur(); }
    return;
  }
  if((ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && detailL && detailNav && detailTab !== '3d' && document.getElementById('modal') && !/INPUT|TEXTAREA|SELECT/.test((et && et.tagName) || '') && !(et && et.isContentEditable)){
    ev.preventDefault(); goDetail(ev.key === 'ArrowRight' ? 1 : -1); return;
  }
  if(ev.key === 'Escape'){
    var fullBtn = document.querySelector('.t3d.is-full [data-a="full"]');
    if(fullBtn){ fullBtn.click(); return; }
    var mn = document.getElementById('m-nav'); if(mn && !mn.hidden){ closeMenu(); return; }
    if(FED){ var fp = document.getElementById('fed-prev'); if(fp && !fp.hidden){ var cb = fp.querySelector('[data-fed="closeprev"]'); if(cb) cb.click(); } else closeFurniture(); return; }
    if(document.getElementById('pmodal')) closePolicy();
    else if(document.getElementById('modal')) closeModal();
    else if(svcEditor) closeSvc();
    else if(editor) closeEditor();
    return;
  }
  if(ev.key === 'Tab'){
    if(document.getElementById('bld') || document.getElementById('fed')) return;
    var box = document.querySelector('#pmodal .modal') || document.querySelector('#modal .modal') || document.getElementById('sheet');
    if(!box) return;
    var f = Array.prototype.filter.call(box.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]):not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'), function(x){ return x.offsetWidth || x.offsetHeight || x === document.activeElement; });
    if(!f.length) return;
    var first = f[0], last = f[f.length - 1], a = document.activeElement;
    if(!box.contains(a)){ ev.preventDefault(); first.focus(); }
    else if(ev.shiftKey && a === first){ ev.preventDefault(); last.focus(); }
    else if(!ev.shiftKey && a === last){ ev.preventDefault(); first.focus(); }
  }
});
